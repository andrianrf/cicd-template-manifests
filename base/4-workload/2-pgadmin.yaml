apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
        version: v1
    spec:
      containers:
        - name: pgadmin
          image: docker.io/dpage/pgadmin4:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@microidn.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: P4ssw0rd1!