apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
data:
  nginx.conf: |
    worker_processes auto;

    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        types_hash_max_size 2048;

        client_body_temp_path /tmp/client_temp;
        
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;

        server {
            listen 8080;

            client_max_body_size 5M;

            #proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Host   $host;
            proxy_set_header    X-Forwarded-Proto  $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            server_tokens off;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "*";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "no-referrer";
            add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";

            proxy_cookie_path / "/; SameSite=None; HTTPOnly; Secure";

            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            error_page 404 /404.html;
            location = /404.html {}

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {}

            location /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                proxy_pass http://backoffice:8080/index.html;
            }

            location /manifest.json {
                add_header Cache-Control "public, max-age=31536000, immutable";
                proxy_pass http://backoffice:8080/index.html;
            }

            location /static/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
                proxy_pass http://backoffice:8080/static/;
            }

            location /assets/ {
                proxy_pass http://backoffice:8080/assets/;
            }

            location /backoffice {
                proxy_pass http://backoffice:8080;
            }

            location /backoffice-be {
                proxy_pass http://api-gateway:8080;
            }

            location /payment-gateway {
                proxy_pass http://api-gateway:8080;
            }
        }
    }